<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia</title>
    <link rel="icon" href="assets/icons/senati.ico" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/asistencia.css">
</head>
<body>
    <main class="profile-container">
  <!-- 1. Logo superior con borde azul -->
  <div class="logo-box">
    <img src="assets/images/logo_sin_fondo_blanco.png" alt="SENATI" class="logo-senati" />
  </div>

  <!-- 2. Avatar de usuario -->
  <div class="avatar-box">
    <img src="assets/images/persona.png" alt="Avatar de usuario" class="avatar-img" />
  </div>

  <!-- 3. Nombre del usuario -->
  <h2 class="user-name">OJITOS LANDA GABRIEL</h2>

  <!-- 4. Contenedor de cámara / reconocimiento facial -->
  <div class="camera-frame">
    <!-- Tu foto o elemento <video> de la cámara -->
    <img src="assets/images/camarsa.gif" alt="Captura facial" class="camera-feed" />

    <!-- 4 Esquinas de enfoque facial -->
    <span class="corner top-left"></span>
    <span class="corner top-right"></span>
    <span class="corner bottom-left"></span>
    <span class="corner bottom-right"></span>
  </div>
</main>
</body>
</html>
